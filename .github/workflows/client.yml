name: Client CI

on:
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client.yml"
  push:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/client.yml"

defaults:
  run:
    working-directory: client

jobs:
  flutter:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run service tests
        run: >
          flutter test --no-pub
          test/install_launcher_test.dart
          test/api_client_test.dart
          test/mock_testflight_service_test.dart
          test/remote_testflight_service_test.dart
          test/testflight_service_factory_test.dart
          -r expanded

      - name: Run Web launcher tests
        run: flutter test --no-pub --platform chrome test/install_launcher_test.dart -r expanded

      - name: Build Web debug bundle
        run: flutter build web --no-pub --debug
