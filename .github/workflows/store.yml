name: Independent Store Service

on:
  pull_request:
    paths: ["store-service/**", ".github/workflows/store.yml"]
  push:
    branches: [main]
    paths: ["store-service/**", ".github/workflows/store.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: store-service

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: docker build --target store-api -t testflying-store-api:ci .
      - run: docker build --target store-connector -t testflying-store-connector:ci .

  connector-binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            binary: store-connector
          - os: macos-15
            target: darwin-arm64
            binary: store-connector
          - os: macos-15-intel
            target: darwin-amd64
            binary: store-connector
          - os: windows-latest
            target: windows-amd64
            binary: store-connector.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release --package store-connector
      - uses: actions/upload-artifact@v4
        with:
          name: connector-${{ matrix.target }}
          path: store-service/target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7
