openapi: 3.1.0
info:
  title: Unified Center API - Stores, Nodes and Screenshots
  version: '2026-11-11'
  description: >-
    Store calls are real-time without drafts or automatic mutation retries.
    Screenshot jobs are asynchronous, routed by exact platform/package bindings and retained for seven days.
    Screenshot images upload directly from nodes to OSS; center stores no image bytes. Screenshot routes require HTTPS.
servers:
  - url: http://localhost:8200
components:
  securitySchemes:
    integrationToken: {type: http, scheme: bearer, description: 'HTTPS integration credential; enabled store and screenshot nodes, independent app bindings and business calls. Screenshot job visibility is limited to the creating integration.'}
    clientToken: {type: http, scheme: bearer, description: STORE_API_TOKEN}
    adminToken: {type: http, scheme: bearer, description: STORE_API_ADMIN_TOKEN}
    nodeToken: {type: http, scheme: bearer, description: Individually provisioned Connector token}
    uploadToken: {type: http, scheme: bearer, bearerFormat: JWT, description: Thirty-minute file/application-scoped upload credential; not stored in database.}
  parameters:
    platform:
      name: platform
      in: path
      required: true
      schema: {type: string, enum: [ios, android]}
    bundleIdentifier:
      name: bundleIdentifier
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 180, pattern: '^[A-Za-z0-9_.-]+$'}
    id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    imageLocale:
      name: locale
      in: query
      description: For store-images only. Exact case-insensitive locale after trimming. Omit or blank for all; no fallback when unmatched. Choose from supported-locales.
      schema: {type: string}
    imageDevice:
      name: device
      in: query
      description: For store-images only. Omit or blank for all. iOS supports all three; Android supports phone/tablet and rejects foldable with 422 unsupported_image_device. Do not send all or duo.
      schema: {type: string, enum: [phone, tablet, foldable, '']}
  schemas:
    ScreenshotBindingInput:
      type: object
      additionalProperties: false
      required: [connectorId]
      properties:
        connectorId: {type: string, format: uuid}
    ScreenshotTarget:
      type: object
      additionalProperties: false
      required: [locale, page, device]
      properties:
        locale: {type: string, minLength: 1, maxLength: 80, pattern: '^[A-Za-z0-9_-]+$', description: 'Explicit ASCII language identifier, preserved verbatim without trimming.'}
        page: {type: string, minLength: 1, maxLength: 128, description: 'Caller page identifier, at most 128 UTF-8 bytes; no control characters or surrounding whitespace.'}
        device: {type: string, enum: [phone, tablet, foldable]}
        theme: {type: string, enum: [light, dark], description: 'Optional; omit when no theme is specified.'}
      description: One explicit screenshot combination; no Cartesian expansion. Device is a form factor, not a fixed simulator ID. Codex manages the local project and simulator.
    ScreenshotJobInput:
      type: object
      additionalProperties: false
      required: [platform, bundleIdentifier, prompt, target]
      properties:
        platform: {type: string, enum: [ios, android]}
        bundleIdentifier: {type: string, minLength: 1, maxLength: 180, pattern: '^[A-Za-z0-9_.-]+$', description: 'Exact case-sensitive Bundle ID or package, independently bound to a screenshot node.'}
        prompt: {type: string, minLength: 1, maxLength: 16384, description: 'At most 16 KiB UTF-8 bytes; forwarded verbatim. App identity and targets are supplied separately through get_capture_task.'}
        target:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items: {$ref: '#/components/schemas/ScreenshotTarget'}
          description: 'Explicit locale/page/device/theme combinations, at most 64 KiB serialized JSON. Duplicate combinations are rejected.'
        profile: {type: [string, 'null'], minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$', description: Optional task hint; no fixed profiles required.}
      description: 'The center creates and returns a UUID jobId. Do not supply jobId, taskId, connectorId, clientRequestId or callback. No store binding or store credentials required. Updated screenshot worker with task protocol 3 is required.'
    ScreenshotImage:
      type: object
      properties:
        targetIndex: {type: integer, minimum: 0, description: Zero-based position in the submitted target array.}
        target: {$ref: '#/components/schemas/ScreenshotTarget'}
        imageUrl: {type: string, format: uri}
        imageUrlExpiresAt: {type: string, format: date-time}
        objectKey: {type: string}
        sizeBytes: {type: integer}
        sha256: {type: string}
    ScreenshotJob:
      type: object
      properties:
        jobId: {type: string, format: uuid, description: 'Center-generated ID returned by submission. The same ID is persisted, forwarded to the node and reserved for result notification.'}
        connectorId: {type: string, format: uuid}
        platform: {type: string, enum: [ios, android]}
        bundleIdentifier: {type: string}
        profile: {type: [string, 'null']}
        target: {type: array, items: {$ref: '#/components/schemas/ScreenshotTarget'}, description: Original target order.}
        status: {type: string, enum: [queued, running, uploading, succeeded, failed]}
        result:
          type: [object, 'null']
          properties:
            images: {type: array, items: {$ref: '#/components/schemas/ScreenshotImage'}, description: 'Confirmed images in target order; partial results remain visible when a later target fails.'}
            notificationStatus: {type: string, enum: [not_configured, protocol_pending]}
          description: All targets must be confirmed before status becomes succeeded.
        error: {type: [string, 'null']}
    CreateStoreRelease:
      type: object
      required: [versionString]
      properties:
        versionString: {type: string, minLength: 1}
        copyright: {type: string}
      description: iOS only. Node resolves the app and creates an IOS version with releaseType MANUAL, without review submission or build attachment.
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            requestId: {type: string, description: Center-generated correlation ID; also returned in X-Testflying-Request-Id}
    ConnectorInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        kind: {type: string, enum: [store, screenshot], default: store}
    Connector:
      type: object
      required: [connectorId, name, enabled, appCount, connected]
      properties:
        connectorId: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string, enum: [store, screenshot]}
        baseUrl: {type: [string, 'null'], description: Reported by authenticated Connector; used only for internal HTTP fallback.}
        enabled: {type: boolean}
        appCount: {type: integer, minimum: 0}
        connected: {type: boolean, description: Active WSS connection only; not an HTTP health probe.}
    Installation:
      type: object
      description: Private node configuration. Add store credential paths locally before live use.
      properties:
        connectorId: {type: string, format: uuid}
        token: {type: string, readOnly: true, description: Secret returned only by authorized provisioning endpoints.}
        serverUrl: {type: string, format: uri}
        messageKey: {type: string, description: Private Noise PSK; never sent as a header or URL.}
        uploadKey: {type: string, description: Private node-specific upload verification key.}
        baseUrl: {type: [string, 'null'], description: Optional node HTTP address announced with encrypted authentication.}
        listenAddr: {type: string}
        requestTimeoutSeconds: {type: integer, minimum: 1, maximum: 300}
        provider: {type: object, additionalProperties: true}
    Sync:
      type: object
      description: Android sync commits the Google edit normally and may send changes for review. Omits changesNotSentForReview; retains changesInReviewBehavior=ERROR_IF_IN_REVIEW to reject when changes are already in review. Not a draft-only save, no automatic mutation retries.
      required: [operation]
      allOf:
        - if:
            properties:
              operation: {enum: [update_app_metadata, update_release_notes]}
          then:
            required: [locale]
        - if:
            properties:
              operation: {const: update_marketing_page}
          then:
            anyOf:
              - required: [locale]
              - required: [marketingPage]
                properties:
                  marketingPage: {required: [locale]}
      properties:
        operation: {type: string, enum: [update_app_metadata, update_release_notes, update_marketing_page]}
        locale: {type: string, minLength: 1}
        syncScopes:
          type: array
          minItems: 1
          items: {type: string, enum: [metadata, description, keywords, promotional_text, short_description, title, subtitle, video, store_images, marketing_text]}
          description: Omit for defaults. Explicit empty/malformed selections are rejected.
        metadata:
          type: object
          description: Missing text fields remain unchanged; explicit empty string clears selected text.
          properties:
            title: {type: string}
            subtitle: {type: string}
            description: {type: string}
            fullDescription: {type: string}
            shortDescription: {type: string}
            promotionalText: {type: string}
            keywords: {type: string}
            videoUrl: {type: string}
            storeImages: {$ref: '#/components/schemas/StoreImages'}
        releaseNotes: {type: string}
        storeRelease:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            track: {type: string, minLength: 1}
            versionCode: {type: string, minLength: 1}
            versionName: {type: string, minLength: 1}
        marketingPage:
          type: object
          properties:
            pageName: {type: string}
            applePageId: {type: string}
            locale: {type: string, minLength: 1, description: Optional override of the top-level locale for CPP.}
            promotionalText: {type: string}
            storeImages: {$ref: '#/components/schemas/StoreImages'}
    StoreImages:
      type: object
      description: Only present slots are replaced; explicit empty source arrays clear that slot. iOS uploads into Apple Asset Library, commits the image and then replaces and orders placements without polling processing state. Runtime image specs are validated before upload. No library asset deletion or automatic mutation replay. Multi-step placement writes are not transactional. Query device is not a sync selector.
      additionalProperties: false
      properties:
        phone_screenshots: {$ref: '#/components/schemas/ImageSlot'}
        tablet_screenshots: {$ref: '#/components/schemas/ImageSlot'}
        foldable_screenshots:
          allOf: [{$ref: '#/components/schemas/ImageSlot'}]
          description: iOS iPhone Duo only; runtime inner/outer placement groups. Android rejects this slot.
        feature_graphic_url:
          allOf: [{$ref: '#/components/schemas/ImageSlot'}]
          description: Android only.
    ImageSlot:
      type: object
      additionalProperties: false
      anyOf: [{required: [urls]}, {required: [assets]}]
      properties:
        urls: {type: array, items: {type: string, format: uri}}
        assets:
          type: array
          items:
            oneOf:
              - type: object
                required: [assetId]
                additionalProperties: false
                properties:
                  assetId: {type: string, format: uuid}
              - type: object
                required: [downloadUrl]
                not: {required: [assetId]}
                properties:
                  downloadUrl: {type: string, format: uri}
                  fileName: {type: string}
    UploadInput:
      type: object
      additionalProperties: false
      required: [fileName, contentType, sizeBytes, sha256]
      properties:
        fileName: {type: string, minLength: 1, maxLength: 255}
        contentType: {type: string, enum: [image/png, image/jpeg]}
        sizeBytes: {type: integer, minimum: 1, maximum: 67108864}
        sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
    PPO:
      type: object
      required: [name, trafficProportion]
      properties:
        name: {type: string, minLength: 1}
        trafficProportion: {type: integer, minimum: 1, maximum: 100}
        locales: {type: array, items: {type: string, minLength: 1}}
        treatments:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: {type: string}
              appIconName: {type: string}
              locales: {type: array, items: {type: string}}
    Preflight:
      type: object
      required: [operation]
      properties:
        operation: {type: string, enum: [update_app_metadata, update_release_notes, update_marketing_page]}
        locale: {type: string, description: Optional in current preflight implementation.}
  responses:
    Data:
      description: Store or registry JSON response. Sync callers must also inspect succeeded/failed status.
      content: {application/json: {schema: {type: object, additionalProperties: true}}}
    Error:
      description: >-
        401 unauthorized, 404 unmapped app, 409 account busy/duplicate connection,
        422 invalid payload, 429 store rate limit, 502 upstream failure,
        503 disabled/disconnected node or unavailable binary, 504 deadline.
        A timed-out mutation may already have changed the store; query before retriggering.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
security: [{integrationToken: []}, {clientToken: []}]
paths:
  /v1/screenshot-settings:
    get:
      summary: Read masked OSS and pending external notification settings
      description: HTTPS administrator only. Secret values are never returned. Fixed callback protocol is pending; this endpoint does not send notifications.
      security: [{adminToken: []}]
      responses: {'200': {$ref: '#/components/responses/Data'}, default: {$ref: '#/components/responses/Error'}}
    put:
      summary: Save encrypted screenshot delivery settings
      description: HTTPS administrator only. Partial groups may be updated; omitted or blank passwords preserve existing values. Enabling OSS requires region, bucket, complete bucket Endpoint and credentials. Changing AccessKey ID requires a new Secret. Configuration takes effect on subsequent upload tickets.
      security: [{adminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                oss:
                  type: object
                  additionalProperties: false
                  properties:
                    enabled: {type: boolean}
                    region: {type: string}
                    bucket: {type: string}
                    endpoint: {type: string, format: uri, description: Complete bucket hostname or CNAME; no automatic bucket prefix.}
                    prefix: {type: string, default: screenshots}
                    publicBaseUrl: {type: string}
                    accessKeyId: {type: string}
                    accessKeySecret: {type: string, writeOnly: true}
                    securityToken: {type: string, writeOnly: true}
                notification:
                  type: object
                  additionalProperties: false
                  properties:
                    url: {type: string}
                    token: {type: string, writeOnly: true}
      responses: {'200': {$ref: '#/components/responses/Data'}, default: {$ref: '#/components/responses/Error'}}
  /v1/screenshot-connectors:
    get:
      summary: List all enabled Screenshot Connectors, including offline Macs
      description: HTTPS only. No node tokens or store nodes returned. Store forwarding pauses do not block screenshot operations.
      security: [{integrationToken: []}]
      responses:
        '200':
          description: Screenshot nodes with kind, appCount, enabled and connected state.
          content: {application/json: {schema: {type: object, properties: {connectors: {type: array, items: {$ref: '#/components/schemas/Connector'}}}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/apps/{platform}/{bundleIdentifier}/screenshot-connector:
    parameters: [{$ref: '#/components/parameters/platform'}, {$ref: '#/components/parameters/bundleIdentifier'}]
    put:
      summary: Bind or replace the app's screenshot Mac independently of its store binding
      description: HTTPS only. Requires an enabled Screenshot Connector; offline is permitted. Rebinding only affects future jobs; already-created jobs keep their assigned node. Persistent across center restarts.
      security: [{integrationToken: []}, {adminToken: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ScreenshotBindingInput'}}}
      responses: {'200': {$ref: '#/components/responses/Data'}, default: {$ref: '#/components/responses/Error'}}
    get:
      summary: Read the app's screenshot binding, even if the node has since been disabled
      description: HTTPS only; missing binding returns 404 screenshot_app_not_found.
      security: [{integrationToken: []}, {adminToken: []}]
      responses: {'200': {$ref: '#/components/responses/Data'}, default: {$ref: '#/components/responses/Error'}}
    delete:
      summary: Remove a screenshot app binding without canceling existing jobs
      description: HTTPS only; idempotent; store binding unaffected.
      security: [{integrationToken: []}, {adminToken: []}]
      responses: {'204': {description: Screenshot binding removed or already absent}, default: {$ref: '#/components/responses/Error'}}
  /v1/screenshot-jobs:
    post:
      summary: Trigger screenshot targets and receive a center-generated jobId
      description: HTTPS only; exact screenshot binding required. No random fallback. Offline enabled nodes may queue. At most 20 queued and one running per node. 202 returns jobId and means queued, not completed. Each accepted POST creates a new job; do not automatically replay a request when its response is lost. No query is required to execute or complete the task. Missing OSS or notification configuration does not block execution. Task protocol 3 and per-target direct OSS upload require the updated Screenshot Connector; old nodes including protocol 2 cannot claim new tasks.
      security: [{integrationToken: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ScreenshotJobInput'}}}
      responses:
        '202': {description: 'Job queued; save the returned center-generated jobId', content: {application/json: {schema: {$ref: '#/components/schemas/ScreenshotJob'}}}}
        default: {$ref: '#/components/responses/Error'}
    get:
      summary: Optional diagnostics using the jobId returned by submission
      description: HTTPS only. Supply the center-generated jobId as a query parameter and use the creating integration token. This query is not part of execution or notification. Other integrations receive 404 even for the same Mac. Result images carry their original target and zero-based targetIndex. All targets must be confirmed for success; partial confirmed images survive a later failure. notificationStatus is not_configured or protocol_pending; no callback is sent yet. Center stores no PNG. Records retained for approximately seven days.
      security: [{integrationToken: []}]
      parameters: [{name: jobId, in: query, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Screenshot job state and result, content: {application/json: {schema: {$ref: '#/components/schemas/ScreenshotJob'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/forwarding:
    get:
      summary: Read persistent per-platform forwarding switches
      security: [{adminToken: []}]
      responses: {'200': {$ref: '#/components/responses/Data'}, default: {$ref: '#/components/responses/Error'}}
  /v1/forwarding/{platform}:
    put:
      summary: Enable or pause all new store requests and uploads for one platform
      description: Persistent across restarts. Admitted requests continue; node connections and diagnostics remain available. Disabled requests return 503 platform_forwarding_disabled without contacting a node.
      security: [{adminToken: []}]
      parameters: [{$ref: '#/components/parameters/platform'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [enabled], properties: {enabled: {type: boolean}}}}}
      responses: {'200': {$ref: '#/components/responses/Data'}, default: {$ref: '#/components/responses/Error'}}
  /v1/store-management/apps/{platform}/{bundleIdentifier}/store-releases:
    get:
      summary: List iOS version states and editability or Android track releases
      description: Node resolves version state. iOS returns id, versionString, platform, state, appStoreState, appVersionState, editable, isLatest and createdDate. No fallback to an older editable version. The center never inspects Apple version state.
      parameters: [{$ref: '#/components/parameters/platform'}, {$ref: '#/components/parameters/bundleIdentifier'}]
      responses: {'200': {$ref: '#/components/responses/Data'}, default: {$ref: '#/components/responses/Error'}}
    post:
      summary: Create an iOS App Store version without review submission
      description: Node resolves Bundle ID then creates IOS appStoreVersions with releaseType MANUAL. No build attachment or review submission. Old nodes return 409 connector_upgrade_required. No center Apple-state validation.
      parameters: [{$ref: '#/components/parameters/platform'}, {$ref: '#/components/parameters/bundleIdentifier'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateStoreRelease'}}}
      responses: {'200': {$ref: '#/components/responses/Data'}, default: {$ref: '#/components/responses/Error'}}
  /v1/connectors/{id}/logs/latest:
    get:
      summary: Stream the latest Store Connector log snapshot; administrator only
      description: Requires an upgraded store node. Uses encrypted WSS or authenticated node HTTP fallback. The center does not persist the file. No store call or mutation replay. Business/integration tokens cannot read this endpoint. Cache-Control no-store.
      security: [{adminToken: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '200':
          description: Fixed snapshot of the latest private JSONL file; streamed in bounded chunks.
          content: {application/x-ndjson: {schema: {type: string, format: binary}}}
        '409':
          description: logs_upgrade_required for a connected old node, or connector_disabled.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/diagnostics/logs:
    post:
      summary: Node-side read-only log control interface
      description: Call the node address, not the center. Same LogRequest is sent over encrypted WSS. Does not require an app binding, store credentials or an available store task slot. Returns a StoreReply envelope with requestId, status and body; no arbitrary path access.
      security: [{nodeToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, action]
              additionalProperties: false
              properties:
                requestId: {type: string, minLength: 1, maxLength: 128}
                action:
                  oneOf:
                    - {type: object, required: [type], additionalProperties: false, properties: {type: {const: latest}}}
                    - type: object
                      required: [type, file, offset, length, snapshotSize]
                      additionalProperties: false
                      properties:
                        type: {const: read}
                        file: {type: string, pattern: '^store-connector-[0-9]{10}\.jsonl$'}
                        offset: {type: integer, minimum: 0}
                        length: {type: integer, minimum: 1, maximum: 32768}
                        snapshotSize: {type: integer, minimum: 0}
      responses: {'200': {$ref: '#/components/responses/Data'}, default: {$ref: '#/components/responses/Error'}}
  /v1/logs:
    get:
      summary: Administrator-only center logs retained for seven days
      description: Business tokens cannot read logs. Text is represented by lengths and hashes; credentials and raw bodies are excluded. Responses use Cache-Control no-store.
      security: [{adminToken: []}]
      parameters:
        - {name: requestId, in: query, schema: {type: string}}
        - {name: connectorId, in: query, schema: {type: string}}
        - {name: platform, in: query, schema: {type: string, enum: [ios, android]}}
        - {name: identifier, in: query, schema: {type: string}}
        - {name: event, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: integer, minimum: 100, maximum: 599}}
        - {name: errorsOnly, in: query, schema: {type: boolean, default: false}}
        - {name: before, in: query, schema: {type: integer, minimum: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses: {'200': {$ref: '#/components/responses/Data'}, default: {$ref: '#/components/responses/Error'}}
  /v1/store-management/api-docs:
    get:
      summary: Read the unified contract for ten store, two node and six screenshot endpoints, plus upload helpers
      description: Requires no app binding, node or store account. Describes the center contract, not live node capabilities. Integration tokens require HTTPS; business tokens support HTTP and HTTPS. Cache-Control no-store. Administrator tokens do not authenticate this route.
      parameters:
        - name: format
          in: query
          schema: {type: string, enum: [json, markdown, openapi], default: json}
      responses:
        '200':
          description: Same deployed contract in JSON catalog, full Markdown or OpenAPI YAML.
          content:
            application/json: {schema: {type: object, required: [schemaVersion, contractVersion, endpoints, uploadEndpoints, imageQuery, sync, documentation]}}
            text/markdown: {schema: {type: string}}
            application/yaml: {schema: {type: string}}
        default: {$ref: '#/components/responses/Error'}
  /v1/store-management/connectors:
    get:
      summary: List every enabled store Connector available to the external system
      description: Returns connectorId, name, enabled and connected. connected reports WSS state; a registered HTTP fallback can still be used when WSS is disconnected.
      responses: {'200': {$ref: '#/components/responses/Data'}, default: {$ref: '#/components/responses/Error'}}
  /health:
    get:
      security: []
      responses: {'200': {$ref: '#/components/responses/Data'}}
  /v1/connectors:
    get:
      security: [{adminToken: []}]
      summary: List sanitized Connector records
      responses: {'200': {$ref: '#/components/responses/Data'}, default: {$ref: '#/components/responses/Error'}}
    post:
      security: [{adminToken: []}]
      summary: Create account Connector and return private installation configuration
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ConnectorInput'}}}
      responses: {'201': {$ref: '#/components/responses/Data'}, default: {$ref: '#/components/responses/Error'}}
  /v1/connectors/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      security: [{adminToken: []}]
      responses: {'200': {$ref: '#/components/responses/Data'}, default: {$ref: '#/components/responses/Error'}}
    patch:
      security: [{adminToken: []}]
      summary: Enable or disable account Connector; disabling closes WSS
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [enabled], additionalProperties: false, properties: {enabled: {type: boolean}}}}}
      responses: {'200': {$ref: '#/components/responses/Data'}, default: {$ref: '#/components/responses/Error'}}
  /v1/connectors/{id}/rotate-token:
    parameters: [{$ref: '#/components/parameters/id'}]
    post:
      security: [{adminToken: []}]
      summary: Rotate node credentials and close the current WSS connection
      responses: {'200': {$ref: '#/components/responses/Data'}, default: {$ref: '#/components/responses/Error'}}
  /v1/connectors/{id}/installation:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      security: [{adminToken: []}]
      summary: Retrieve private configuration with Cache-Control no-store
      responses:
        '200':
          description: Private node configuration
          content: {application/json: {schema: {$ref: '#/components/schemas/Installation'}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/connectors/{id}/installer/{target}:
    parameters:
      - {$ref: '#/components/parameters/id'}
      - name: target
        in: path
        required: true
        schema: {type: string, enum: [linux-amd64, linux-arm64, darwin-amd64, darwin-arm64, windows-amd64]}
    get:
      security: [{adminToken: []}]
      summary: Package published binary, private config and launcher into ZIP
      responses:
        '200':
          description: Private node ZIP, never cache publicly
          content: {application/zip: {schema: {type: string, format: binary}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/connectors/{id}/ws:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      security: [{nodeToken: []}]
      description: >-
        WebSocket upgrade with subprotocol testflying.store.v2 and Token in Authorization header.
        Noise NNpsk0 using the private messageKey authenticates registration including baseUrl;
        the endpoint is recorded only after session key confirmation. StoreRequest and StoreReply
        are fragmented into encrypted binary records. Plaintext and older protocols are rejected.
        10-second ping, 35-second
        inactivity deadline. Duplicate active identities rejected; no command replay.
      responses: {'101': {description: WebSocket established}, default: {$ref: '#/components/responses/Error'}}
  /v1/store-management/apps/{platform}/{bundleIdentifier}/uploads:
    parameters: [{$ref: '#/components/parameters/platform'}, {$ref: '#/components/parameters/bundleIdentifier'}]
    post:
      summary: Prepare a temporary image upload through the central API
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UploadInput'}}}
      responses:
        '201':
          description: assetId, central uploadUrl, short-lived uploadToken, expiresAt (Unix seconds) and PUT method. Cache-Control no-store.
          content: {application/json: {schema: {type: object}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/store-management/apps/{platform}/{bundleIdentifier}/uploads/{assetId}:
    parameters:
      - {$ref: '#/components/parameters/platform'}
      - {$ref: '#/components/parameters/bundleIdentifier'}
      - {name: assetId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      security: [{uploadToken: []}]
      summary: Stream a local file through the center to its account Connector
      description: No external direct-node URL, no center file persistence, no retries or resume. File is verified and expires after 15 minutes or is consumed by sync.
      requestBody:
        required: true
        content:
          image/png: {schema: {type: string, format: binary}}
          image/jpeg: {schema: {type: string, format: binary}}
          application/octet-stream: {schema: {type: string, format: binary}}
      responses: {'201': {$ref: '#/components/responses/Data'}, default: {$ref: '#/components/responses/Error'}}
  /v1/apps/{platform}/{bundleIdentifier}/connector:
    parameters: [{$ref: '#/components/parameters/platform'}, {$ref: '#/components/parameters/bundleIdentifier'}]
    get:
      security: [{adminToken: []}]
      responses: {'200': {$ref: '#/components/responses/Data'}, default: {$ref: '#/components/responses/Error'}}
    put:
      security: [{integrationToken: []}, {adminToken: []}]
      summary: Set or replace exact application mapping, many applications to one Connector
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [connectorId], additionalProperties: false, properties: {connectorId: {type: string, format: uuid}}}}}
      responses: {'200': {$ref: '#/components/responses/Data'}, default: {$ref: '#/components/responses/Error'}}
    delete:
      security: [{adminToken: []}]
      responses: {'204': {description: Mapping removed}, default: {$ref: '#/components/responses/Error'}}
  /v1/store-management/apps/{platform}/{bundleIdentifier}/{resource}:
    parameters:
      - {$ref: '#/components/parameters/platform'}
      - {$ref: '#/components/parameters/bundleIdentifier'}
      - name: resource
        in: path
        required: true
        schema:
          type: string
          enum: [supported-locales, store-listings, store-images, store-releases, store-reviews, product-page-optimizations, preflight, sync]
    get:
      description: >-
        supported-locales/store-listings/store-images/store-releases/store-reviews/
        product-page-optimizations only. Other resources return 404.
      parameters:
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
        - {name: pageToken, in: query, schema: {type: string}}
        - {name: startIndex, in: query, schema: {type: string}}
        - {name: translationLanguage, in: query, schema: {type: string}}
        - {name: sort, in: query, schema: {type: string}}
        - {name: rating, in: query, schema: {type: integer, minimum: 1, maximum: 5}}
        - name: locale
          in: query
          description: store-images uses exact case-insensitive matching after trimming, omit/blank for all with no fallback; store-reviews filters the current page. Other resources do not filter by locale.
          schema: {type: string}
        - {$ref: '#/components/parameters/imageDevice'}
        - {name: territory, in: query, schema: {type: string}}
        - {name: date, in: query, schema: {type: string, format: date}}
        - {name: startDate, in: query, schema: {type: string, format: date}}
        - {name: endDate, in: query, schema: {type: string, format: date}}
        - {name: timezone, in: query, schema: {type: string, default: Asia/Shanghai}}
      responses: {'200': {$ref: '#/components/responses/Data'}, default: {$ref: '#/components/responses/Error'}}
    post:
      description: >-
        sync/preflight/product-page-optimizations only. Other resources return 404.
        Body is request content, never a reference to persisted drafts.
        Preflight uses operation/locale; iOS resolves the latest version on the node. Top-level version is removed and never forwarded. PPO uses the PPO schema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf: [{$ref: '#/components/schemas/Sync'}, {$ref: '#/components/schemas/PPO'}, {$ref: '#/components/schemas/Preflight'}]
      responses: {'200': {$ref: '#/components/responses/Data'}, default: {$ref: '#/components/responses/Error'}}
