# Include this server block inside nginx's http {} alongside the existing HTTPS server.
# HTTP clients send API tokens and content without TLS protection.
server {
    listen 80;
    server_name _;

    location = /store-api {
        return 308 /store-api/;
    }

    location /store-api/ {
        proxy_pass http://127.0.0.1:8200/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 1860s;
        proxy_send_timeout 90s;
        proxy_request_buffering off;
        client_body_buffer_size 64k;
        client_max_body_size 64m;

        # Adapt only the generated uploadUrl JSON field for HTTP callers.
        # Keep the configured public URL and newly issued WSS node addresses on HTTPS/WSS.
        # Requires nginx's http_sub_module; nginx -t must pass before reload.
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter '"uploadUrl":"https://$host/store-api/' '"uploadUrl":"http://$host/store-api/';
    }

    location / {
        return 404;
    }
}
